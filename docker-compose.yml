services:
  # 1. Local Database (Emulates AWS RDS PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: local-rds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: graphql_prod_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/lambda/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d graphql_prod_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. GraphQL Server (Emulates AWS ECS Fargate Container)
  graphql-server:
    build:
      context: ./backend/graphql-server
      dockerfile: Dockerfile
    container_name: local-ecs-graphql-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: dbadmin
      DB_PASSWORD: localpassword123
      DB_NAME: graphql_prod_db
    ports:
      - "4000:4000"

  # 3. React Frontend (Emulates S3 + CloudFront Static Hosting)
  frontend:
    image: node:20-alpine
    container_name: local-react-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - graphql-server

volumes:
  postgres_data:

