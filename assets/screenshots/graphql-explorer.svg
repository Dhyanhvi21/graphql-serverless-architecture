<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Window Frame -->
  <rect width="1100" height="620" rx="10" fill="#1e293b"/>
  <!-- Window Header / Title Bar -->
  <path d="M 0 10 C 0 4.47 4.47 0 10 0 L 1090 0 C 1095.53 0 1100 4.47 1100 10 L 1100 36 L 0 36 Z" fill="#0f172a"/>
  <circle cx="18" cy="18" r="5" fill="#ef4444"/>
  <circle cx="34" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="50" cy="18" r="5" fill="#10b981"/>
  <rect x="220" y="7" width="660" height="22" rx="5" fill="#1e293b"/>
  <text x="550" y="22" fill="#94a3b8" font-size="11" text-anchor="middle" class="mono">http://localhost:4000/graphql</text>

  <!-- Body -->
  <rect x="0" y="36" width="1100" height="584" fill="#0b1120"/>

  <!-- Left Side: Query Editor -->
  <rect x="20" y="56" width="510" height="540" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="56" width="510" height="42" rx="8" fill="#1e293b"/>
  <text x="36" y="82" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">GraphQL Operations Query</text>

  <!-- Query Code -->
  <text x="36" y="125" fill="#38bdf8" font-size="13" class="mono">query GetPlatformTasks {</text>
  <text x="56" y="150" fill="#38bdf8" font-size="13" class="mono">  getItems(limit: 10) {</text>
  <text x="76" y="175" fill="#f43f5e" font-size="13" class="mono">    id</text>
  <text x="76" y="200" fill="#f43f5e" font-size="13" class="mono">    title</text>
  <text x="76" y="225" fill="#f43f5e" font-size="13" class="mono">    status</text>
  <text x="76" y="250" fill="#f43f5e" font-size="13" class="mono">    priority</text>
  <text x="76" y="275" fill="#f43f5e" font-size="13" class="mono">    createdAt</text>
  <text x="56" y="300" fill="#38bdf8" font-size="13" class="mono">  }</text>
  <text x="36" y="325" fill="#38bdf8" font-size="13" class="mono">}</text>

  <!-- Execute Button -->
  <rect x="36" y="540" width="130" height="34" rx="6" fill="url(#primaryBtn)"/>
  <polygon points="56,552 56,564 68,558" fill="#ffffff"/>
  <text x="76" y="562" fill="#ffffff" font-size="12" font-weight="bold" class="font-sans">Run Query</text>

  <!-- Right Side: JSON Output -->
  <rect x="550" y="56" width="530" height="540" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="550" y="56" width="530" height="42" rx="8" fill="#1e293b"/>
  <text x="566" y="82" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans">Response (200 OK • 18ms)</text>
  <rect x="990" y="66" width="70" height="22" rx="11" fill="#064e3b"/>
  <text x="1025" y="81" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">RESOLVED</text>

  <!-- JSON Code Output -->
  <text x="566" y="125" fill="#94a3b8" font-size="12" class="mono">{</text>
  <text x="586" y="150" fill="#94a3b8" font-size="12" class="mono">  "data": {</text>
  <text x="606" y="175" fill="#38bdf8" font-size="12" class="mono">    "getItems": [</text>
  <text x="626" y="200" fill="#94a3b8" font-size="12" class="mono">      {</text>
  <text x="646" y="225" fill="#a78bfa" font-size="12" class="mono">        "id": <tspan fill="#34d399">"task-101"</tspan>,</text>
  <text x="646" y="250" fill="#a78bfa" font-size="12" class="mono">        "title": <tspan fill="#34d399">"Provision RDS PostgreSQL Multi-AZ"</tspan>,</text>
  <text x="646" y="275" fill="#a78bfa" font-size="12" class="mono">        "status": <tspan fill="#34d399">"COMPLETED"</tspan>,</text>
  <text x="646" y="300" fill="#a78bfa" font-size="12" class="mono">        "priority": <tspan fill="#34d399">"HIGH"</tspan></text>
  <text x="626" y="325" fill="#94a3b8" font-size="12" class="mono">      },</text>
  <text x="626" y="350" fill="#94a3b8" font-size="12" class="mono">      {</text>
  <text x="646" y="375" fill="#a78bfa" font-size="12" class="mono">        "id": <tspan fill="#34d399">"task-102"</tspan>,</text>
  <text x="646" y="400" fill="#a78bfa" font-size="12" class="mono">        "title": <tspan fill="#34d399">"Deploy ECS Fargate GraphQL Service"</tspan>,</text>
  <text x="646" y="425" fill="#a78bfa" font-size="12" class="mono">        "status": <tspan fill="#34d399">"IN_PROGRESS"</tspan>,</text>
  <text x="646" y="450" fill="#a78bfa" font-size="12" class="mono">        "priority": <tspan fill="#34d399">"CRITICAL"</tspan></text>
  <text x="626" y="475" fill="#94a3b8" font-size="12" class="mono">      }</text>
  <text x="606" y="500" fill="#38bdf8" font-size="12" class="mono">    ]</text>
  <text x="586" y="525" fill="#94a3b8" font-size="12" class="mono">  }</text>
  <text x="566" y="550" fill="#94a3b8" font-size="12" class="mono">}</text>
</svg>
