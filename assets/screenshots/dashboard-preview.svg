<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Window Frame -->
  <rect width="1200" height="780" rx="12" fill="#1e293b"/>
  <!-- Window Header / Title Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 1188 0 C 1194.63 0 1200 5.37 1200 12 L 1200 40 L 0 40 Z" fill="#0f172a"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="6" fill="#10b981"/>
  <rect x="250" y="8" width="700" height="24" rx="6" fill="#1e293b"/>
  <text x="600" y="24" fill="#94a3b8" font-size="12" text-anchor="middle" class="mono">http://localhost:4000/app</text>

  <!-- App Body -->
  <rect x="0" y="40" width="1200" height="740" fill="url(#bg)"/>

  <!-- App Header / Navbar -->
  <rect x="0" y="40" width="1200" height="64" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="40" y="54" width="36" height="36" rx="8" fill="#4f46e5"/>
  <path d="M 48 76 L 56 64 L 62 70 L 68 62" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="71" fill="#ffffff" font-size="15" font-weight="bold" class="font-sans">Platform Console</text>
  <text x="88" y="84" fill="#94a3b8" font-size="11" class="font-sans">Serverless GraphQL &amp; AWS Infrastructure Management</text>

  <!-- Navbar Badges -->
  <rect x="680" y="58" width="130" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-opacity="0.3"/>
  <circle cx="694" cy="72" r="4" fill="#34d399"/>
  <text x="706" y="76" fill="#34d399" font-size="11" font-weight="600" class="font-sans">CloudFront + OAC</text>

  <rect x="822" y="58" width="110" height="28" rx="14" fill="#1e3a8a" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="840" y="76" fill="#60a5fa" font-size="11" font-weight="600" class="font-sans">ECS Fargate</text>

  <rect x="944" y="58" width="110" height="28" rx="14" fill="#581c87" stroke="#7c3aed" stroke-opacity="0.3"/>
  <text x="960" y="76" fill="#c084fc" font-size="11" font-weight="600" class="font-sans">RDS Multi-AZ</text>

  <rect x="1066" y="58" width="94" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="1080" y="76" fill="#38bdf8" font-size="11" font-weight="600" class="font-sans">GraphQL API</text>

  <!-- Content Container -->
  <!-- Hero Banner -->
  <rect x="40" y="124" width="1120" height="90" rx="12" fill="url(#banner)" stroke="#312e81" stroke-width="1"/>
  <rect x="60" y="138" width="160" height="20" rx="10" fill="#312e81"/>
  <text x="70" y="152" fill="#818cf8" font-size="10" font-weight="bold" letter-spacing="1" class="font-sans">CLOUD OPERATIONS CONSOLE</text>
  <text x="60" y="180" fill="#ffffff" font-size="18" font-weight="bold" class="font-sans">Serverless GraphQL Architecture on AWS</text>
  <text x="60" y="198" fill="#cbd5e1" font-size="12" class="font-sans">React frontend on S3/CloudFront with Origin Access Control, Node.js 20 ARM64 Lambda handlers, private ECS Fargate tasks, and isolated Multi-AZ RDS PostgreSQL.</text>

  <!-- 4 Stat Cards -->
  <!-- Card 1 -->
  <rect x="40" y="230" width="265" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-opacity="0.6"/>
  <text x="56" y="252" fill="#94a3b8" font-size="10" font-weight="bold" class="font-sans">LAMBDA RESOLVERS</text>
  <text x="56" y="284" fill="#ffffff" font-size="22" font-weight="bold" class="font-sans">4 Handlers</text>
  <text x="56" y="304" fill="#34d399" font-size="11" class="font-sans">✓ Node.js 20 • ARM64 Graviton</text>

  <!-- Card 2 -->
  <rect x="325" y="230" width="265" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-opacity="0.6"/>
  <text x="341" y="252" fill="#94a3b8" font-size="10" font-weight="bold" class="font-sans">ECS FARGATE REPLICAS</text>
  <text x="341" y="284" fill="#ffffff" font-size="22" font-weight="bold" class="font-sans">2 Tasks</text>
  <text x="341" y="304" fill="#60a5fa" font-size="11" class="font-sans">✓ Auto-Scaled (CPU 70%)</text>

  <!-- Card 3 -->
  <rect x="610" y="230" width="265" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-opacity="0.6"/>
  <text x="626" y="252" fill="#94a3b8" font-size="10" font-weight="bold" class="font-sans">RDS POSTGRESQL</text>
  <text x="626" y="284" fill="#ffffff" font-size="22" font-weight="bold" class="font-sans">Multi-AZ</text>
  <text x="626" y="304" fill="#c084fc" font-size="11" class="font-sans">✓ Isolated Subnets • SSL Enforced</text>

  <!-- Card 4 -->
  <rect x="895" y="230" width="265" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-opacity="0.6"/>
  <text x="911" y="252" fill="#94a3b8" font-size="10" font-weight="bold" class="font-sans">CLOUDWATCH ALARMS</text>
  <text x="911" y="284" fill="#34d399" font-size="22" font-weight="bold" class="font-sans">0 Errors</text>
  <text x="911" y="304" fill="#94a3b8" font-size="11" class="font-sans">✓ SNS Alert Topic Active</text>

  <!-- Mutation Form Card -->
  <rect x="40" y="336" width="1120" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-opacity="0.6"/>
  <text x="60" y="362" fill="#ffffff" font-size="14" font-weight="bold" class="font-sans">+ Create New Item via GraphQL Mutation</text>
  
  <text x="60" y="386" fill="#94a3b8" font-size="11" class="font-sans">Title</text>
  <rect x="60" y="394" width="700" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="72" y="416" fill="#f8fafc" font-size="12" class="font-sans">Set up RDS PostgreSQL Read Replica</text>

  <text x="780" y="386" fill="#94a3b8" font-size="11" class="font-sans">Priority</text>
  <rect x="780" y="394" width="160" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="792" y="416" fill="#f8fafc" font-size="12" class="font-sans">HIGH</text>

  <rect x="960" y="394" width="180" height="34" rx="6" fill="url(#primaryBtn)"/>
  <text x="1050" y="416" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font-sans">Execute Mutation</text>

  <!-- Items Table / List Card -->
  <rect x="40" y="486" width="1120" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-opacity="0.6"/>
  <text x="60" y="514" fill="#ffffff" font-size="14" font-weight="bold" class="font-sans">Managed Items (RDS PostgreSQL)</text>
  <text x="60" y="530" fill="#94a3b8" font-size="11" class="font-sans">Queried dynamically via GraphQL Query Handler</text>

  <!-- Item Row 1 -->
  <line x1="60" y1="544" x2="1140" y2="544" stroke="#334155" stroke-width="1"/>
  <text x="60" y="568" fill="#ffffff" font-size="13" font-weight="600" class="font-sans">Provision RDS PostgreSQL Multi-AZ</text>
  <rect x="290" y="556" width="50" height="18" rx="9" fill="#854d0e" stroke="#ca8a04" stroke-opacity="0.3"/>
  <text x="315" y="569" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">HIGH</text>
  <text x="60" y="586" fill="#94a3b8" font-size="11" class="font-sans">Configured in isolated subnets with KMS encryption and automated backups</text>
  <rect x="1030" y="556" width="90" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-opacity="0.3"/>
  <text x="1075" y="572" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">COMPLETED</text>

  <!-- Item Row 2 -->
  <line x1="60" y1="604" x2="1140" y2="604" stroke="#334155" stroke-width="1"/>
  <text x="60" y="628" fill="#ffffff" font-size="13" font-weight="600" class="font-sans">Deploy ECS Fargate GraphQL Service</text>
  <rect x="300" y="616" width="60" height="18" rx="9" fill="#991b1b" stroke="#dc2626" stroke-opacity="0.3"/>
  <text x="330" y="629" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">CRITICAL</text>
  <text x="60" y="646" fill="#94a3b8" font-size="11" class="font-sans">Private container deployment behind internal Application Load Balancer</text>
  <rect x="1030" y="616" width="90" height="24" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="1075" y="632" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">IN_PROGRESS</text>

  <!-- Item Row 3 -->
  <line x1="60" y1="664" x2="1140" y2="664" stroke="#334155" stroke-width="1"/>
  <text x="60" y="688" fill="#ffffff" font-size="13" font-weight="600" class="font-sans">Configure CloudWatch Alarms &amp; SNS Topic</text>
  <rect x="335" y="676" width="60" height="18" rx="9" fill="#1e3a8a" stroke="#2563eb" stroke-opacity="0.3"/>
  <text x="365" y="689" fill="#60a5fa" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">MEDIUM</text>
  <text x="60" y="706" fill="#94a3b8" font-size="11" class="font-sans">Alarms set for Lambda errors, ECS CPU &gt; 80%, and RDS connections</text>
  <rect x="1030" y="676" width="90" height="24" rx="6" fill="#334155" stroke="#475569"/>
  <text x="1075" y="692" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">PENDING</text>
</svg>
