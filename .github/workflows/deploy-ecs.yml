name: Deploy Private GraphQL Server to ECS Fargate

on:
  push:
    branches: [main]
    paths:
      - 'backend/graphql-server/**'
      - '.github/workflows/deploy-ecs.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-ecs:
    name: Build, Scan & Deploy to ECS Fargate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'graphql-server' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend/graphql-server
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Vulnerability Scan with Trivy (Security Best Practice)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          exit-code: '0' # Non-blocking on warnings; set to 1 for high/critical in strict policy
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Amazon ECR
        run: |
          docker push ${{ env.IMAGE_URI }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY || 'graphql-server' }}:latest

      - name: Update ECS Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend/graphql-server/task-def.json
          container-name: graphql-server
          image: ${{ env.IMAGE_URI }}

      - name: Deploy to Amazon ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME || 'prod-graphql-service' }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME || 'prod-graphql-cluster' }}
          wait-for-service-stability: true # Ensures circuit breaker validates health checks
          wait-for-minutes: 10

      - name: Automated Circuit Breaker Rollback on Failure
        if: failure()
        run: |
          echo "🚨 Deployment failed! ECS Circuit Breaker automatically restores previous task definition."
          echo "Validating previous stable deployment..."
          aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER_NAME || 'prod-graphql-cluster' }} \
            --services ${{ secrets.ECS_SERVICE_NAME || 'prod-graphql-service' }}

