name: Deploy Lambda Functions (Serverless / SAM)

on:
  push:
    branches: [main]
    paths:
      - 'backend/lambda/**'
      - '.github/workflows/deploy-backend-lambda.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambda:
    name: Build & Deploy Lambda Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC Keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/lambda/package.json

      - name: Install dependencies & Compile TypeScript
        run: |
          cd backend/lambda
          npm ci
          npm run build

      - name: Deploy with Serverless Framework (Canary Deployment)
        run: |
          cd backend/lambda
          npx serverless deploy --stage prod \
            --param="dbSecretArn=${{ secrets.DB_SECRET_ARN }}" \
            --param="dbHost=${{ secrets.DB_HOST }}" \
            --param="lambdaSecurityGroupId=${{ secrets.LAMBDA_SG_ID }}" \
            --param="privateSubnet1=${{ secrets.PRIVATE_SUBNET_1 }}" \
            --param="privateSubnet2=${{ secrets.PRIVATE_SUBNET_2 }}"

      - name: Live Smoke Test against GraphQL Endpoint
        run: |
          ENDPOINT="${{ secrets.GRAPHQL_API_URL }}/graphql"
          RESPONSE=$(curl -s -X POST $ENDPOINT \
            -H "Content-Type: application/json" \
            -d '{"query":"query { healthCheck }"}')
          
          echo "GraphQL Health Response: $RESPONSE"
          if [[ "$RESPONSE" != *"healthy"* ]]; then
            echo "Smoke test verification failed!"
            exit 1
          fi

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "🚨 Deployment or smoke test failed! Triggering automated rollback..."
          cd backend/lambda
          npx serverless rollback --stage prod || true
          echo "✅ Rollback executed."

